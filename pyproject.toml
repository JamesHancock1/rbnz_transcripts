[project]
name = "rbnz-fec"
version = "0.1.0"
description = "Collect and transcribe RBNZ post-MPS Finance and Expenditure Committee hearings"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "yt-dlp>=2024.1.1",
  "pandas>=2.0",
]

[project.optional-dependencies]
asr = ["whisperx>=3.3", "torch>=2.1"]

[project.scripts]
rbnz-fec = "rbnz_fec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
